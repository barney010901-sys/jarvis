# Local development stack: PostgreSQL + the backend.
#
# Since Phase 2, the backend connects to Postgres for real (memory,
# knowledge, profile, tasks, audit, cost — see docs/PHASE_2.md) and needs
# ANTHROPIC_API_KEY set for ClaudeOrchestrator; without it, it falls back
# to the Phase 1 stub stack automatically rather than failing to start.
# Phase 3 (policy/wallet/communication/escalation/business/capabilities —
# see docs/PHASE_3.md) shares that same gate.
#
# Usage (from repo root):
#   cp backend/.env.example backend/.env   # then edit it
#   docker compose -f docker/docker-compose.yml up --build
#
# memory/schema.sql and both migrations are mounted into
# docker-entrypoint-initdb.d with numeric prefixes so Postgres applies them
# in order — but ONLY on a brand-new volume. If jarvis_postgres_data
# already exists from an earlier checkout, apply whichever migration you're
# missing by hand instead:
#   docker compose -f docker/docker-compose.yml exec -T postgres \
#     psql -U jarvis -d jarvis -f - < memory/migrations/0003_phase3.sql

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data
      - ../memory/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../memory/migrations/0002_phase2.sql:/docker-entrypoint-initdb.d/02_phase2.sql:ro
      - ../memory/migrations/0003_phase3.sql:/docker-entrypoint-initdb.d/03_phase3.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Repo root, not backend/ — see backend/Dockerfile.
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jarvis_postgres_data:
